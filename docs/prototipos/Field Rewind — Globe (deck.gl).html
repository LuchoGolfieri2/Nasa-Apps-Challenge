/* Field Rewind identity (CLAUDE.md §10). The globe is the subject; the interface is flat map marginalia. */
:root{
  --night:#0F2A1D;--field:#2F7D4F;--sprout:#8ED081;--wheat:#E9B949;--paper:#F6F1E4;--soil:#6B4A2F;--alert:#E5484D;
  --ink-2:rgba(246,241,228,.74);--ink-3:rgba(246,241,228,.56);--rule:rgba(246,241,228,.14);
  --radius:10px;--display:"Bricolage Grotesque",system-ui,sans-serif;--text:"DM Sans",system-ui,sans-serif
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--paper);font:500 15px/1.45 var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
#sky,#hud,#map{position:fixed;inset:0;width:100%;height:100%;display:block}
#map{touch-action:none}
#hud{pointer-events:none}
.ui{position:fixed;z-index:2}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--sprout);outline-offset:2px}

/* Top bar: no box. A short scrim keeps it legible when satellite imagery sits behind it. */
#top{left:0;right:0;top:0;display:flex;align-items:center;gap:28px;padding:14px 24px 36px;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{height:26px;width:auto}
.brand b{font:800 21px/1 var(--display);letter-spacing:-.01em}
.brand b span{font-weight:500}
#nav{display:flex;align-items:center;font-size:14px}
body[data-level="globe"] #nav{display:none}
#back,#crumbs button{min-height:44px;padding:0 8px;background:none;border:0;color:var(--ink-2)}
#back{font-weight:700;color:var(--paper);margin-right:8px;padding-left:0}
#crumbs{display:flex;align-items:center}
#crumbs i{font-style:normal;color:var(--ink-3)}
#crumbs span{padding:0 8px;font-weight:700}

/* Side sheet: one opaque surface, docked, no glass, no nested cards. */
#panel{right:0;top:0;bottom:0;width:372px;overflow:auto;overscroll-behavior:contain;background:var(--night);border-left:1px solid var(--rule);padding:28px 28px 32px}
#panel[hidden],#p-stats[hidden],#p-twins[hidden],#p-twinlist[hidden],#legend[hidden]{display:none}
#p-name{margin:0;font:800 32px/1.05 var(--display);letter-spacing:-.015em;text-wrap:balance}
#p-state{margin:6px 0 0;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
#p-status{margin:16px 0 0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
#p-status.ok{color:var(--sprout)}
#p-status.missing{color:var(--ink-2)}
#p-status.missing::before{content:"";flex:none;width:14px;height:14px;border:1px dashed var(--ink-3);border-radius:2px;background:repeating-linear-gradient(135deg,rgba(246,241,228,.28) 0 2px,transparent 2px 5px)}
.proto{display:flex;align-items:center;gap:8px;margin:28px 0 12px;font-size:12.5px;color:var(--ink-3)}
.tag{flex:none;font:700 11px/1 var(--text);letter-spacing:.04em;text-transform:uppercase;color:var(--night);background:var(--wheat);border-radius:3px;padding:4px 5px 3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.stats div{padding:12px 12px 0 0}
.stats div+div{padding-left:12px;border-left:1px solid var(--rule)}
.stats b{display:block;white-space:nowrap;font:800 20px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats small{display:block;margin-top:4px;font-size:12px;line-height:1.3;color:var(--ink-2)}
.seg{display:inline-flex;margin-top:8px;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{min-width:36px;min-height:32px;padding:0 8px;background:none;border:0;font-size:12px;font-weight:700;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--night)}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:28px}
.btn{min-height:48px;padding:0 20px;border-radius:var(--radius);border:1px solid var(--rule);background:transparent;font-weight:700;transition:background-color .15s ease-out,border-color .15s ease-out}
.btn.primary{background:var(--sprout);border-color:transparent;color:var(--night)}
.btn:disabled{background:rgba(246,241,228,.07);border-color:transparent;color:var(--ink-3);cursor:not-allowed}
.twins button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 0;min-height:48px}
.twins button:last-child{border-bottom:1px solid var(--rule)}
.twins b{display:block;font-size:15px}
.twins small{display:block;margin-top:2px;font-size:12.5px;line-height:1.35;color:var(--ink-2)}

/* Map legend: the one boxed element, because it sits on imagery. */
#legend{left:24px;bottom:36px;width:272px;background:var(--night);border-radius:var(--radius);padding:12px 14px 10px}
#legend .t{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;font-size:13px;font-weight:700;margin-bottom:8px}
#legend .bar{height:8px;border-radius:2px;background:linear-gradient(90deg,rgb(68,1,84),rgb(59,82,139),rgb(33,145,140),rgb(94,201,98),rgb(253,231,37))}
#legend .n{display:flex;justify-content:space-between;margin-top:4px;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#sources{left:24px;bottom:12px;font-size:11px;color:var(--ink-3)}

#start{left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;transition:opacity .3s ease-out}
body:not([data-level="globe"]) #start{opacity:0;pointer-events:none}
#cta{font-size:16px;padding:0 24px}
#start small{font-size:13px;color:var(--ink-2)}

/* Landing sits over the live globe instead of hiding it behind a glow. */
#landing{inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;background:rgba(0,0,0,.6)}
body.landing #landing{display:flex}
#landing .logo{display:flex;align-items:center;gap:clamp(14px,2.2vw,28px)}
#landing svg{height:clamp(52px,8vw,104px);width:auto}
#landing h1{margin:0;font:800 clamp(44px,7.5vw,104px)/1 var(--display);letter-spacing:-.02em}
#landing h1 span{font-weight:500}
#landing p{margin:0;font-size:clamp(18px,2vw,26px);color:var(--ink-2)}
#enter{margin-top:12px;min-height:52px;padding:0 36px;font-size:17px}
#landing small{position:absolute;bottom:24px;left:0;right:0;font-size:12.5px;color:var(--ink-3)}

#toast{left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--paper);color:var(--night);font-size:13px;font-weight:700;padding:10px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s ease-out,transform .2s ease-out}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (hover:hover){
  #back:hover,#crumbs button:hover{color:var(--paper)}
  .btn:not(:disabled):hover{border-color:rgba(246,241,228,.4)}
  .btn.primary:not(:disabled):hover{background:#A6DE9B}
  .twins button:hover b{color:var(--sprout)}
}
@media (prefers-reduced-motion:reduce){#toast,#start,.btn{transition:none}}
body.recording .ui:not(#top),body.recording #nav{display:none!important}
body.landing .ui:not(#landing){visibility:hidden}
@media (max-width:760px){
  #top{padding:10px 16px 28px;gap:12px}
  .brand b{font-size:18px;white-space:nowrap}
  #crumbs{display:none}
  #back{white-space:nowrap}
  #legend{display:none}
  #panel{top:auto;left:0;width:auto;max-height:62vh;border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;padding:20px 20px 24px}
  #p-name{font-size:26px}
  #sources{left:16px}
}

const sctx = sky.getContext("2d"), hctx = hud.getContext("2d");

  const r = n => { const v = Math.sin(i * 127.1 + n * 311.7) * 43758.5453; return v - Math.floor(v); };
  const b = r(5);
  return {x: r(1), y: r(2), s: .3 + Math.pow(r(3), 3) * 1.4, p: r(4) * 6.28, b: .25 + b * b * .75};
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; base = Math.min(W, H) * .37;
  for (const c of [sky, hud]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
}
window.addEventListener("resize", resize);

const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function flyTo(to, dur = 1500) {
  let d = to.lon - R.lon; d = ((d + 180) % 360 + 360) % 360 - 180;
  V = {from: {...R}, to: {lon: R.lon + d, lat: to.lat, k: to.k}, start: performance.now(), dur};
}
const PANEL_HALF = 186; // half the side sheet, so the target sits centred in the visible map
const panelOffset = (k, lat) => W > 900 ? PANEL_HALF / (base * k) / rad / Math.cos(lat * rad) : 0;
// on phones the sheet covers the bottom ~60%: lift the target into the visible top part
const sheetLift = k => W <= 760 ? H * .17 / (base * k) / rad : 0;
function fitK(f, t) {
  const [[x0, y0], [x1, y1]] = f.bounds, lat = (y0 + y1) / 2;
  const u = Math.abs(x1 - x0) * Math.cos(lat * rad) * rad, v = Math.abs(y1 - y0) * rad;
  return Math.min(W, H) * t / (Math.max(u, v) * base);
}
const emit = (name, detail) => window.dispatchEvent(new CustomEvent(`fieldrewind:${name}`, {detail}));

function flyToState(id, move = true) {
  const s = stateById[id]; if (!s) return;
  selState = s; selCounty = null; twinMode = false; level = "state";
  if (move) { const k = fitK(s, W > 900 ? .62 : .7); flyTo({lon: s.centroid[0] + panelOffset(k, s.centroid[1]), lat: s.centroid[1] - sheetLift(k), k}, 1500); }
  emit("state", {fips: id, name: s.properties.name}); updateUI();
}
function flyToCounty(id, move = true) {
  const c = countyById[id]; if (!c) return;
  selState = stateById[c.properties.state]; selCounty = c; twinMode = false; level = "county";
  if (move) {
    const k = Math.min(fitK(c, .3), 60);
    flyTo({lon: c.centroid[0] + panelOffset(k, c.centroid[1]), lat: c.centroid[1] - sheetLift(k), k}, 1500);
  }
  emit("county", {fips: id, name: c.properties.name, state: selState.properties.name, hasHistory: !!DEMO[id]});
  updateUI();
}
function reset() { selState = null; selCounty = null; twinMode = false; level = "globe"; flyTo(HOME, 1400); updateUI(); }
function showTwins(on) {
  if (!selCounty) return;
  twinMode = on;
  if (on) flyTo({lon: -94.4 + (W > 900 ? 2.2 : 0), lat: 39.9, k: Math.min(W, H) * .8 / (15.5 * rad * base)}, 1500);
  else flyToCounty(selCounty.id);
  updateUI();
}
function goBack() { twinMode ? showTwins(false) : level === "county" ? flyToState(selState.id) : reset(); }

// ---- deck.gl
const markInput = () => { lastInput = performance.now(); spinV = 0; };
["pointerdown", "wheel", "keydown", "touchstart"].forEach(e =>
  window.addEventListener(e, markInput, {capture: true, passive: true}));
window.addEventListener("pointermove", e => { if (e.buttons) lastInput = performance.now(); }, {capture: true, passive: true});

const viewState = () => ({longitude: R.lon, latitude: R.lat, zoom: zoomOfK(R.k),
  minZoom: zoomOfK(K_MIN), maxZoom: zoomOfK(K_MAX)});

const deckgl = new Deck({
  parent: document.getElementById("map"),
  views: new GlobeView({id: "globe", resolution: 5}),
  viewState: viewState(),
  controller: {inertia: 400, scrollZoom: {speed: .01, smooth: true}, keyboard: false, dragRotate: false},
  useDevicePixels: 2,
  onViewStateChange: ({viewState: vs, interactionState: is}) => {
    if (take) return;
    if (is && (is.isDragging || is.isZooming || is.isPanning || is.inTransition)) { V = null; lastInput = performance.now(); }
    R.lon = vs.longitude; R.lat = Math.max(-80, Math.min(80, vs.latitude)); R.k = kOfZoom(vs.zoom);
  },
  getCursor: ({isDragging, isHovering}) => isDragging ? "grabbing" : isHovering ? "pointer" : "grab",
  onHover: info => { hover = info.object && !take ? {type: info.layer.id === "counties" ? "county" : "state", f: info.object} : null; },
  onClick: info => {
    if (take || !info.object) return;
    info.layer.id === "counties" ? flyToCounty(info.object.id) : flyToState(info.object.id);
  },
  onError: e => console.error("deck", e && e.stack),
  layers: []
});

const memo = new Map();
const one = (key, obj) => { if (!obj) return []; const m = memo.get(key); if (m && m[0] === obj) return m; const a = [obj]; memo.set(key, a); return a; };

function buildLayers(t, pulse, a) {
  const twinSet = twinMode && selCounty ? new Set(selCounty.twins.map(x => x.f)) : null;
  const centre = [R.lon, R.lat], front = p => angDist(p, centre) < 1.45;
  const hoverState = hover && hover.type === "state" ? hover.f : null;
  const hoverCounty = hover && hover.type === "county" && hover.f !== selCounty ? hover.f : null;
  const stateFade = 1 - a * .85;
  const layers = [
    new SolidPolygonLayer({id: "ocean", data: [[[-180, 90], [0, 90], [180, 90], [180, -90], [0, -90], [-180, -90]]],
      getPolygon: d => d, getFillColor: OCEAN, parameters: {depthWriteEnabled: false}}),
    new TileLayer({id: "bluemarble", data: TILE_URL, minZoom: 0, maxZoom: 8, tileSize: 256, maxRequests: 12,
      onTileError: () => {},
      renderSubLayers: props => {
        const [[w, s], [e, n]] = props.tile.boundingBox;
        return new BitmapLayer(props, {data: null, image: props.data, bounds: [w, s, e, n],
          _imageCoordinateSystem: COORDINATE_SYSTEM.CARTESIAN});
      }}),
    // glow under the highlighted states, then the states themselves
    new GeoJsonLayer({id: "states-glow", data: STATES, filled: false, stroked: true, lineWidthUnits: "pixels",
      getLineWidth: 9, getLineColor: [...GLOW, Math.round((40 + 50 * pulse) * stateFade)],
      updateTriggers: {getLineColor: [pulse, stateFade]}}),
    new GeoJsonLayer({id: "states", data: STATES, filled: true, stroked: true, pickable: R.k <= COUNTY_K + .6,
      lineWidthUnits: "pixels",
      getFillColor: f => {
        const dim = selState && selState !== f ? .45 : 1;
        const c = f === hoverState ? GLOW : LEAF;
        return [...c, Math.round(255 * dim * (.5 + .12 * pulse) * stateFade)];
      },
      getLineColor: f => [...GLOW, Math.round(255 * (selState && selState !== f ? .45 : 1))],
      getLineWidth: f => f === selState || f === hoverState ? 2.4 : 1.5,
      updateTriggers: {getFillColor: [selState && selState.id, hoverState && hoverState.id, pulse, stateFade],
        getLineColor: [selState && selState.id], getLineWidth: [selState && selState.id, hoverState && hoverState.id]}}),
  ];
  if (a > .01) {
    layers.push(
      new GeoJsonLayer({id: "counties", data: COUNTIES, opacity: a, filled: true, stroked: true,
        pickable: R.k > COUNTY_K + .6, lineWidthUnits: "pixels", getLineWidth: 1, getLineColor: [...CREAM, 150],
        getFillColor: f => [...f.rgb, twinSet && f !== selCounty && !twinSet.has(f) ? 70 : 255],
        updateTriggers: {getFillColor: [twinMode, selCounty && selCounty.id]}}),
      new GeoJsonLayer({id: "county-hover", data: one("hover", hoverCounty), filled: true, stroked: true,
        lineWidthUnits: "pixels", getFillColor: [255, 255, 255, 64], getLineColor: CREAM, getLineWidth: 1.5}),
      new GeoJsonLayer({id: "county-selected", data: one("sel", selCounty), filled: false, stroked: true,
        lineWidthUnits: "pixels", getLineColor: WHITE, getLineWidth: 3.5}));
    if (twinSet) layers.push(
      new GeoJsonLayer({id: "twin-outlines", data: one("twins", selCounty.twins.map(x => x.f)), filled: false, stroked: true,
        lineWidthUnits: "pixels", getLineColor: WHITE, getLineWidth: 2.5}),
      new ArcLayer({id: "twin-arcs", data: selCounty.twins, getSourcePosition: () => selCounty.centroid,
        getTargetPosition: d => d.f.centroid, getSourceColor: WHITE, getTargetColor: [...WHITE, 200],
        getWidth: 2.6, widthUnits: "pixels", getHeight: .35, greatCircle: false,
        updateTriggers: {getSourcePosition: selCounty.id}}),
      new ScatterplotLayer({id: "twin-dots", data: selCounty.twins, getPosition: d => d.f.centroid,
        radiusUnits: "pixels", getRadius: 5, getFillColor: WHITE}));
  }
  if (take === "c") layers.push(new GeoJsonLayer({id: "argentina", data: ARGENTINA, filled: false, stroked: true,
    lineWidthUnits: "pixels", getLineWidth: 1.6, getLineColor: GLOW}));

  // labels are drawn on the HUD canvas (soft shadow), see drawLabels()
  LABELS = [];
  // state names hand over to county names: never both on screen (state names gone before counties reach a = .3)
  if (R.k > 1.7 && a < .3) {
    const al = Math.min(1, R.k - 1.7) * clamp01(1 - a / .3), size = Math.min(26, 11 + R.k * 2);
    for (const s of STATES) if (front(s.centroid))
      LABELS.push({p: s.centroid, text: s.properties.name.toUpperCase(), size, alpha: al, caps: true});
  }
  if (a > .3) for (const id of Object.keys(DEMO)) {
    const c = countyById[id]; if (!front(c.centroid)) continue;
    LABELS.push({p: c.centroid, text: c.properties.name, size: R.k > 20 ? 20 : 15, alpha: clamp01((a - .3) / .3), county: c});
  }
  if (twinMode && selCounty) for (const x of [{f: selCounty}, ...selCounty.twins])
    if (!DEMO[x.f.id]) LABELS.push({p: x.f.centroid, text: x.f.properties.name, size: 15, alpha: 1, dy: -18});
  if (hoverCounty && !DEMO[hoverCounty.id] && front(hoverCounty.centroid))
    LABELS.push({p: hoverCounty.centroid, text: hoverCounty.properties.name, size: 13, alpha: 1});
  return layers;
}

let viewport = null, LABELS = [];
function halfHeightPx(c) {
  if (!viewport) return 10;
  const [[x0, y0], [x1, y1]] = c.bounds;
  return Math.abs(viewport.project([x0, y0])[1] - viewport.project([x1, y1])[1]) / 2;
}
function globeRadiusPx() {
  if (!viewport) return base * R.k;
  if (R.k > 8) return base * R.k;
  let best = 0;
  for (let d = .9; d <= 1.5708; d += .015) {
    const [x, y] = viewport.project(dest([R.lon, R.lat], 90, d));
    best = Math.max(best, Math.hypot(x - W / 2, y - H / 2));
  }
  return best;
}

function drawSky(t, u, r) {
  const c = sctx, cx = W / 2, cy = H / 2;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .8);
  g.addColorStop(0, "#03070D"); g.addColorStop(1, "#000000");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (u > .02) {
    c.fillStyle = "#FFFFFF";
    for (const s of STARS) {
      c.globalAlpha = u * s.b * (.7 + .3 * Math.sin(t * .9 + s.p));
      c.beginPath(); c.arc(s.x * W, s.y * H, s.s, 0, 6.2832); c.fill();
    }
    c.globalAlpha = 1;
  }
  if (r < Math.max(W, H) * 1.2) { // thin atmosphere rim
    const a = c.createRadialGradient(cx, cy, r * .985, cx, cy, r * 1.11);
    a.addColorStop(0, "rgba(150,205,255,0.55)"); a.addColorStop(.3, "rgba(90,160,255,0.18)"); a.addColorStop(1, "rgba(60,130,255,0)");
    c.fillStyle = a; c.beginPath(); c.arc(cx, cy, r * 1.11, 0, 6.2832); c.fill();
  }
}

function shadowText(c, text, x, y, fill) { // soft dark shadow, drawn twice so it holds on bright imagery
  c.shadowColor = "rgba(0,0,0,0.9)"; c.shadowOffsetX = 0; c.shadowOffsetY = 1;
  c.fillStyle = fill; c.shadowBlur = 8; c.fillText(text, x, y); c.shadowBlur = 3; c.fillText(text, x, y);
  c.shadowColor = "transparent"; c.shadowBlur = 0; c.shadowOffsetY = 0;
}
function label(c, text, x, y, size, fill, weight = 700, family = "DM Sans") {
  c.font = `${weight} ${size}px "${family}", system-ui, sans-serif`;
  c.textAlign = "center"; c.textBaseline = "middle"; c.letterSpacing = "0px";
  shadowText(c, text, x, y, fill);
}
function drawLabels(c) {
  for (const l of LABELS) {
    const [x, y] = viewport.project(l.p);
    const dy = l.county ? -(halfHeightPx(l.county) + 16) : l.dy || 0;
    c.globalAlpha = l.alpha;
    c.font = `700 ${l.size}px "DM Sans", system-ui, sans-serif`;
    c.textAlign = "center"; c.textBaseline = "middle";
    c.letterSpacing = l.caps ? `${(l.size * .08).toFixed(1)}px` : "0px";
    shadowText(c, l.text, x, y + dy, COL.cream);
  }
  c.globalAlpha = 1; c.letterSpacing = "0px";
}
function drawHud(t, u, r) {
  const c = hctx, cx = W / 2, cy = H / 2;
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, W, H);
  if (u > .02) { // night side: light from the upper left
    const s = c.createRadialGradient(cx - r * .42, cy - r * .34, r * .2, cx - r * .42, cy - r * .34, r * 1.6);
    s.addColorStop(0, "rgba(0,0,0,0)"); s.addColorStop(.5, "rgba(0,0,0,0)");
    s.addColorStop(.82, `rgba(0,2,8,${.55 * u})`); s.addColorStop(1, `rgba(0,0,4,${.88 * u})`);
    c.fillStyle = s; c.beginPath(); c.arc(cx, cy, r, 0, 6.2832); c.fill();
  }
  if (!viewport) return;
  drawLabels(c);
  if (R.k <= 1.7 && !take && !document.body.classList.contains("landing") && angDist([-93.5, 40], [R.lon, R.lat]) < 1.45) { // callout
    const [x, y] = viewport.project([-93.4, 40.6]), x2 = x + base * .3, y2 = y - base * .3;
    c.globalAlpha = Math.max(0, 1.7 - R.k);
    c.beginPath(); c.moveTo(x, y); c.lineTo(x2 - 8, y2 + 8); c.strokeStyle = COL.glow; c.lineWidth = 1.5; c.stroke();
    c.textAlign = "left"; c.textBaseline = "alphabetic";
    c.font = '700 15px "DM Sans", system-ui, sans-serif'; c.letterSpacing = "1.2px"; shadowText(c, "IOWA · ILLINOIS · KANSAS", x2, y2 - 6, COL.glow);
    c.font = '500 13px "DM Sans", system-ui, sans-serif'; c.letterSpacing = "0px"; shadowText(c, "Click a state to explore", x2, y2 + 13, "rgba(246,241,228,0.85)");
    c.globalAlpha = 1;
  }
  if (take === "c" && angDist([-64, -36], [R.lon, R.lat]) < 1.45) {
    const [x, y] = viewport.project([-64, -35]);
    c.globalAlpha = Math.max(0, Math.min(1, takeProgress() * 3 - 1.9));
    label(c, "Next: Argentina", x + base * .02, y - 14, 30, COL.cream, 800, "Bricolage Grotesque");
    label(c, "as data is added", x + base * .02, y + 18, 18, COL.glow, 500);
    c.globalAlpha = 1;
  }
}

function frame(now) {
  try { step(now); } catch (e) { if (!frame.err) console.error("frame", e.stack); frame.err = 1; }
  requestAnimationFrame(frame);
}
function step(now) {
  const t = (now - T0) / 1000, dt = lastT ? Math.min(.1, (now - lastT) / 1000) : 0; lastT = now;
  if (V) {
    lastInput = now; spinV = 0;
    const s = Math.min(1, (now - V.start) / V.dur), l = ease(s);
    R.lon = V.from.lon + (V.to.lon - V.from.lon) * l;
    R.lat = V.from.lat + (V.to.lat - V.from.lat) * l;
    R.k = Math.exp(Math.log(V.from.k) + (Math.log(V.to.k) - Math.log(V.from.k)) * l);
    if (s >= 1) V = null;
  } else { // idle spin: starts 3 s after the last input, eases in, stops at once on input
    const idle = level === "globe" && !take && !reduceMotion.matches && now - lastInput > 3000;
    spinV += ((idle ? SPIN_SPEED : 0) - spinV) * (1 - Math.exp(-dt / (idle ? 1.2 : .25)));
    if (spinV > .001) R.lon = ((R.lon - spinV * dt + 180) % 360 + 360) % 360 - 180;
  }
  const pulse = .5; // static: the highlight marks where data exists, it is not live
  const a = Math.round(clamp01((R.k - COUNTY_K) / 2) * 50) / 50;
  const u = clamp01(1.6 - R.k * .35);
  deckgl.setProps({viewState: viewState(), layers: buildLayers(t, pulse, a),
    controller: take ? false : {inertia: 400, scrollZoom: {speed: .01, smooth: true}, keyboard: false, dragRotate: false}});
  if (deckgl.isInitialized) viewport = deckgl.getViewports()[0] || viewport;
  const r = globeRadiusPx();
  drawSky(t, u, r); drawHud(t, u, r);
}

// ---- panel, crumbs and buttons (same DOM as the canvas version)
let rainUnit = "in";
try { if (localStorage.getItem("fieldrewind:rain-unit") === "mm") rainUnit = "mm"; } catch (e) {}
const rainText = mm => rainUnit === "mm" ? `${Math.round(mm)} mm` : `${(mm / 25.4).toFixed(1)} in`;
const $ = id => document.getElementById(id);
function updateUI() {
  document.body.dataset.level = level;
  const crumbs = ['<button data-go="globe">Globe</button>'];
  if (selState) crumbs.push(`<button data-go="state">${selState.properties.name}</button>`);
  if (selCounty) crumbs.push(`<span>${selCounty.properties.name} County</span>`);
  $("crumbs").innerHTML = crumbs.join("<i>›</i>");
  const panel = $("panel"), pct = n => `${Math.round(n * 100)}%`;
  $("legend").hidden = level === "globe";
  $("p-stats").hidden = !selCounty; $("p-twins").hidden = !selCounty; $("p-twinlist").hidden = !(selCounty && twinMode);
  if (selCounty) {
    const full = !!DEMO[selCounty.id], m = selCounty.mock;
    $("p-name").textContent = `${selCounty.properties.name} County`;
    $("p-state").textContent = `${selState.properties.name} · FIPS ${selCounty.id}`;
    $("p-status").textContent = full ? "Full history · 2015–2025" : "Missing data: history not loaded for this county yet";
    $("p-status").className = full ? "ok" : "missing";
    $("p-open").disabled = !full;
    $("p-open").textContent = "Open county history →";
    $("p-stats").innerHTML = `<div class="proto"><span class="tag">Prototype data</span>Invented placeholder values</div><div class="stats"><div><b>${pct(m.corn)}</b><small>Corn share of cropland</small></div><div><b>${m.top}</b><small>Most common crop</small></div><div><b>${rainText(m.rain)}</b><small>Rain per year</small><span class="seg" role="group" aria-label="Rain units"><button type="button" data-unit="in" aria-pressed="${rainUnit === "in"}">in</button><button type="button" data-unit="mm" aria-pressed="${rainUnit === "mm"}">mm</button></span></div></div>`;
    $("p-twins").textContent = twinMode ? "← Back to county" : "Counties like yours";
    $("p-twinlist").innerHTML = '<div class="proto"><span class="tag">Prototype data</span>Similar soil and climate</div><div class="twins">' + selCounty.twins.map(x =>
      `<button data-fips="${x.f.id}"><b>${x.f.properties.name}, ${stateById[x.f.properties.state].properties.name}</b><small>Similar on ${x.similar.join(" and ")} · ${x.f.mock.top} on ${pct(x.f.mock.corn > .42 ? x.f.mock.corn : .3 + x.f.mock.soil * .2)} of fields</small></button>`).join("") + '</div>';
    panel.hidden = false;
  } else if (selState) {
    const n = COUNTIES.filter(c => c.properties.state === selState.id).length;
    const demo = Object.keys(DEMO).find(id => id.startsWith(selState.id));
    $("p-name").textContent = selState.properties.name;
    $("p-state").textContent = `${n} counties`;
    $("p-status").textContent = `Demo county: ${DEMO[demo]}`; $("p-status").className = "ok";
    $("p-open").disabled = false; $("p-open").textContent = `Go to ${DEMO[demo]} County →`;
    panel.hidden = false;
  } else panel.hidden = true;
}
$("crumbs").addEventListener("click", e => {
  const go = e.target.dataset && e.target.dataset.go;
  if (go === "globe") reset();
  if (go === "state" && selState) flyToState(selState.id);
});
$("p-stats").addEventListener("click", e => {
  const b = e.target.closest("button[data-unit]"); if (!b || b.dataset.unit === rainUnit) return;
  rainUnit = b.dataset.unit;
  try { localStorage.setItem("fieldrewind:rain-unit", rainUnit); } catch (err) {}
  updateUI();
  const again = $("p-stats").querySelector(`button[data-unit="${rainUnit}"]`); if (again) again.focus();
});
$("back").addEventListener("click", goBack);
$("p-twins").addEventListener("click", () => showTwins(!twinMode));
$("p-twinlist").addEventListener("click", e => { const b = e.target.closest("button[data-fips]"); if (b) flyToCounty(b.dataset.fips); });
$("enter").addEventListener("click", () => { document.body.classList.remove("landing"); flyTo(HOME, 2600); });
$("cta").addEventListener("click", () => flyToCounty(START));
$("p-open").addEventListener("click", () => {
  if (selCounty) {
    emit("open", {fips: selCounty.id});
    $("toast").textContent = `fieldrewind:open → ${selCounty.id} (connect the County History screen here)`;
    $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 2600);
  } else if (selState) flyToCounty(Object.keys(DEMO).find(id => id.startsWith(selState.id)));
});
window.addEventListener("keydown", e => { if (e.key === "Escape") goBack(); });

// ---- recording takes for the video (?take=a or ?take=c)
let takeStart = 0, takeDur = 1;
const takeProgress = () => Math.min(1, (performance.now() - takeStart) / takeDur);
function startTake(name) {
  take = name; document.body.classList.add("recording"); takeStart = performance.now();
  if (name === "a") {
    takeDur = 6000; Object.assign(R, {lon: -20, lat: 22, k: 1});
    flyTo({lon: -96, lat: 37, k: 1.15}, 2000);
    setTimeout(() => flyToState("20"), 2000); setTimeout(() => flyToCounty("20191"), 3900);
  } else {
    takeDur = 3000; const ks = stateById["20"];
    Object.assign(R, {lon: ks.centroid[0], lat: ks.centroid[1], k: fitK(ks, .7)});
    flyTo({lon: -64, lat: -30, k: 1.25}, 2300);
  }
}

resize(); updateUI();
const takeParam = (new URLSearchParams(location.search).get("take") || (location.hash.match(/take-([ac])/) || [])[1] || "").toLowerCase();
const fonts = Promise.all([document.fonts.load('700 16px "DM Sans"'), document.fonts.load('800 16px "Bricolage Grotesque"')]);
Promise.race([fonts, new Promise(r => setTimeout(r, 1500))]).then(() => {
  if (takeParam === "a" || takeParam === "c") { document.body.classList.remove("landing"); startTake(takeParam); }
  requestAnimationFrame(frame);
});
window.FieldRewindGlobe = {flyToState, flyToCounty, showTwins, reset, view: () => ({...R, level})};
})();
